[workspace]
members = [
    "crates/core",
    "crates/arey",
    "crates/tools-search",
    "crates/tools-fetch",
    "crates/mcp",
]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2024"
authors = ["Your Name <you@example.com>"]
description = "LLM tool"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
async-openai = { version = "0.43.0", features = ["byot", "chat-completion"] }
async-stream = "0.3"
async-trait = "0.1.92"
chrono = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0"
encoding_rs = "0.8.44"
env_logger = "0.11"
futures = "0.3"
home = "0.5"
lazy_static = "1.5.1"
markdown = "1.0.0"
notify = "8.2.2"
once_cell = "1.21.4"
path-absolutize = "4.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "^0.13", default-features = false, features = [
    "json",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1.2"
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "signal",
    "time",
    "process",
] }
tokio-stream = "0.1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "local-time",
    "env-filter",
] }
tempfile = "3.27.0"
url = "2.5.8"
wiremock = "0.6.5"
yare = "3"
